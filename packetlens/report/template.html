<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PacketLens Report</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f0efec; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --accent:#2a78d6; --accent-ink:#fff;
  --series-1:#2a78d6;
  --crit:#d03b3b; --high:#ec835a; --med:#fab219; --low:#2a78d6; --info:#898781; --good:#0ca30c;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* packet colouring (after Chris Greer's TCP/ThreatHunt profiles) */
  --c-bad-bg:#121212; --c-bad-fg:#ff6b6b; --c-icmperr-bg:#121212; --c-icmperr-fg:#b7f28a;
  --c-rst-bg:#f4c7c3; --c-syn-bg:#c9f2c0; --c-fin-bg:#c7dcff; --c-tls-bg:#c8f6f1; --c-http-bg:#e2fbd3;
  --c-dns-bg:#fff0cc; --c-dnswarn-bg:#ffd9a0; --c-dnserr-bg:#ffb3b3; --c-arp-bg:#faf0d7; --c-icmp-bg:#fce0ff;
  --c-routing-bg:#fff4d6; --c-tcp-bg:#ecebff; --c-udp-bg:#dcf1ff; --c-bcast-bg:#e6e6e6; --c-cks-bg:#f7c6c6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --accent:#3987e5; --series-1:#3987e5; --low:#3987e5;
    --c-bad-bg:#000; --c-bad-fg:#ff6b6b; --c-icmperr-bg:#000; --c-icmperr-fg:#9be36b;
    --c-rst-bg:#4a1f1d; --c-syn-bg:#1f3a1c; --c-fin-bg:#1c2b47; --c-tls-bg:#153b38; --c-http-bg:#22331a;
    --c-dns-bg:#3a3117; --c-dnswarn-bg:#4a3413; --c-dnserr-bg:#4d1d1d; --c-arp-bg:#34301f; --c-icmp-bg:#3a2340;
    --c-routing-bg:#383119; --c-tcp-bg:#25243b; --c-udp-bg:#172b3a; --c-bcast-bg:#2c2c2c; --c-cks-bg:#4d2020;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --accent:#3987e5; --series-1:#3987e5; --low:#3987e5;
  --c-bad-bg:#000; --c-bad-fg:#ff6b6b; --c-icmperr-bg:#000; --c-icmperr-fg:#9be36b;
  --c-rst-bg:#4a1f1d; --c-syn-bg:#1f3a1c; --c-fin-bg:#1c2b47; --c-tls-bg:#153b38; --c-http-bg:#22331a;
  --c-dns-bg:#3a3117; --c-dnswarn-bg:#4a3413; --c-dnserr-bg:#4d1d1d; --c-arp-bg:#34301f; --c-icmp-bg:#3a2340;
  --c-routing-bg:#383119; --c-tcp-bg:#25243b; --c-udp-bg:#172b3a; --c-bcast-bg:#2c2c2c; --c-cks-bg:#4d2020;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand small{font-weight:400;color:var(--ink-2);margin-left:8px}
.spacer{flex:1}
button,.btn{font:inherit;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--axis)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 16px;max-width:1500px;margin:0 auto}
nav.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 12px;color:var(--ink-2);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1500px;margin:0 auto;padding:16px}
section.tab{display:none} section.tab.on{display:block}
a{color:var(--accent)}
h2{font-size:18px;margin:20px 0 10px} h3{font-size:15px;margin:14px 0 8px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.tile .v{font-size:26px;font-weight:650}
.tile .k{color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--ink-2)} .small{font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.sev::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.sev.critical{--c:var(--crit)} .sev.high{--c:var(--high)} .sev.medium{--c:var(--med)} .sev.low{--c:var(--low)} .sev.info{--c:var(--info)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);font-size:12px;color:var(--ink-2);margin:0 4px 4px 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:12px;color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
input[type=search],select{font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input[type=search]{flex:1;min-width:200px}
/* root causes */
.rc{border-left:4px solid var(--c);}
.rc.critical{--c:var(--crit)} .rc.high{--c:var(--high)} .rc.medium{--c:var(--med)} .rc.low{--c:var(--low)} .rc.info{--c:var(--info)}
.rc h3{margin:6px 0 4px;font-size:16px}
.verdict{font-weight:600;margin:6px 0}
.chain{list-style:none;margin:10px 0;padding:0;position:relative}
.chain li{position:relative;padding:4px 0 10px 26px}
.chain li::before{content:"";position:absolute;left:7px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.chain li::after{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:1px;background:var(--axis)}
.chain li:last-child::after{display:none}
.persp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-top:8px}
.persp div{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px}
.persp b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);margin-bottom:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
ul.tight{margin:4px 0;padding-left:18px} ul.tight li{margin:2px 0}
details.f{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
details.f summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:start}
details.f summary::-webkit-details-marker{display:none}
details.f[open] summary{border-bottom:1px solid var(--grid)}
details.f .body{padding:10px 14px}
.filterbox{display:flex;gap:6px;align-items:center;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:12.5px;overflow-x:auto}
.pkt{cursor:pointer}
.pkt td{padding:2px 8px;font-family:var(--mono);font-size:12px;white-space:nowrap;border-bottom:none}
.pkt.bad_tcp td{background:var(--c-bad-bg);color:var(--c-bad-fg)} .pkt.icmp_error td{background:var(--c-icmperr-bg);color:var(--c-icmperr-fg)}
.pkt.rst td{background:var(--c-rst-bg)} .pkt.syn td{background:var(--c-syn-bg)} .pkt.fin td{background:var(--c-fin-bg)}
.pkt.tls td{background:var(--c-tls-bg)} .pkt.http td{background:var(--c-http-bg)} .pkt.dns td{background:var(--c-dns-bg)}
.pkt.dns_warn td{background:var(--c-dnswarn-bg)} .pkt.dns_error td{background:var(--c-dnserr-bg)} .pkt.arp td{background:var(--c-arp-bg)}
.pkt.icmp td{background:var(--c-icmp-bg)} .pkt.routing td{background:var(--c-routing-bg)} .pkt.tcp td{background:var(--c-tcp-bg)}
.pkt.udp td{background:var(--c-udp-bg)} .pkt.broadcast td{background:var(--c-bcast-bg)} .pkt.checksum td{background:var(--c-cks-bg)}
.pkt.sel td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:140px 1fr 70px;gap:8px;align-items:center;margin:3px 0;font-size:13px}
.hbar .track{height:12px;background:transparent;border-radius:4px;position:relative}
.hbar .fill{height:12px;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:6px}
.meter>div{height:100%;border-radius:0 4px 4px 0}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);display:none;z-index:20;max-width:340px}
.ladderwrap{overflow:auto;max-height:75vh;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:13px}
.kv b{color:var(--ink-2);font-weight:500}
.empty{padding:24px;text-align:center;color:var(--ink-2)}
.warn{background:var(--surface-2);border-left:3px solid var(--med);padding:8px 12px;border-radius:6px;margin:8px 0}
/* 3D path + scenarios */
.p3{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
.stage{position:relative;height:min(68vh,620px);min-height:380px;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage .lbl{position:absolute;transform:translate(-50%,-135%);font-size:11.5px;white-space:nowrap;pointer-events:none;color:var(--ink);
  background:color-mix(in srgb,var(--surface) 82%,transparent);border-radius:6px;padding:1px 6px;border:1px solid var(--border)}
.stage .lbl.inf{color:var(--muted);border-style:dashed}
.stage .cap{position:absolute;left:10px;right:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;font-size:13px;min-height:38px}
.stage .hud{position:absolute;top:8px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.stage .hud button{padding:4px 9px;font-size:12px}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.flowlist{max-height:300px;overflow:auto}
.flowrow{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.flowrow:hover{background:var(--surface-2)} .flowrow.on{background:var(--surface-2);outline:1px solid var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--c)}
.st-ok{--c:var(--good)} .st-degraded{--c:var(--med)} .st-oneway{--c:var(--low)} .st-fail{--c:var(--crit)}
.hopchain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.hopchain .h{border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--surface-2);cursor:pointer}
.hopchain .h.inf{border-style:dashed;color:var(--ink-2)} .hopchain .h.brk{border-color:var(--crit);color:var(--crit);font-weight:600}
.hopchain .h.capt{box-shadow:inset 0 -2px 0 var(--accent)}
.legend3{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend3 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.scen-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px}
.topic{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px} .topic:hover{background:var(--surface-2)} .topic.on{background:var(--surface-2);font-weight:600}
.steps{counter-reset:s;list-style:none;padding:0;margin:6px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 6px 30px;font-size:13px}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);font-size:11px;display:grid;place-items:center}
.fcard{border:1px solid var(--border);border-left:4px solid var(--crit);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--surface)}
.fcard.seen{border-left-color:var(--high);box-shadow:0 0 0 1px var(--high) inset}
.fcard h4{margin:0 0 4px;font-size:14px}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:6px}
.fcols div{background:var(--surface-2);border-radius:8px;padding:6px 9px;font-size:12.5px}
.fcols b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2)}
@media (max-width:900px){ .p3,.scen-grid{grid-template-columns:1fr} }
@media (max-width:640px){ details.f summary{grid-template-columns:1fr} .hbar{grid-template-columns:90px 1fr 50px} main{padding:12px 16px} }
@media print{ header{position:static} nav.tabs{display:none} section.tab{display:block!important;page-break-before:always} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">PacketLens <small id="hdr-src"></small></div>
    <div class="spacer"></div>
    <button id="btn-json" title="Download analysis as JSON">JSON</button>
    <button id="btn-theme" title="Toggle light/dark">Theme</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div id="tip"></div>
<script src="__THREE_SRC__"></script>
<script id="pl-data" type="application/json">__PACKETLENS_DATA__</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("pl-data").textContent);
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtB = n => n>=1e9?(n/1e9).toFixed(2)+" GB":n>=1e6?(n/1e6).toFixed(2)+" MB":n>=1e3?(n/1e3).toFixed(1)+" KB":n+" B";
const fmtBps = n => n>=1e9?(n/1e9).toFixed(2)+" Gbps":n>=1e6?(n/1e6).toFixed(2)+" Mbps":n>=1e3?(n/1e3).toFixed(1)+" kbps":n+" bps";
const fmtS = s => s==null?"—":s>=1?s.toFixed(3)+" s":(s*1000).toFixed(1)+" ms";
const ms = v => v==null?"—":v.toFixed(v<10?2:0)+" ms";
const SEV = ["critical","high","medium","low","info"];
const sev = s => `<span class="sev ${s}">${s}</span>`;
const tip = $("#tip");
function showTip(e, html){ tip.innerHTML = html; tip.style.display="block"; const x=Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8); tip.style.left=x+"px"; tip.style.top=(e.clientY+14)+"px"; }
function hideTip(){ tip.style.display="none"; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

/* ---------- theme ---------- */
const savedTheme = store("pl-theme"); if(savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#btn-theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx = cur==="dark"?"light":"dark"; document.documentElement.dataset.theme = nx; store("pl-theme", nx); };
$("#btn-json").onclick = () => { const b = new Blob([JSON.stringify(D,null,1)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=(D.meta.source||"capture")+".packetlens.json"; a.click(); };
$("#hdr-src").textContent = `${D.meta.source} · ${D.stats.packets.toLocaleString()} packets · v${D.meta.version}`;

/* ---------- tabs ---------- */
const TABS = [["overview","Overview"],["path","Path 3D"],["scen","Scenarios ("+(D.scenarios||[]).length+")"],
  ["rootcause","Root causes ("+D.root_causes.length+")"],["findings","Findings ("+D.findings.length+")"],
  ["tcp","TCP streams ("+D.streams.length+")"],["app","DNS · DHCP"],["web","Web · URLs · TLS"],["routing","Routing"],
  ["packets","Packets"],["conv","Conversations · Endpoints"]];
const nav = $("#tabs"), main = $("#main");
TABS.forEach(([id,label])=>{ const b=document.createElement("button"); b.textContent=label; b.dataset.tab=id; b.onclick=()=>show(id); nav.appendChild(b);
  const s=document.createElement("section"); s.className="tab"; s.id="tab-"+id; main.appendChild(s); });
const rendered = {};
function show(id, then){ document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===id));
  document.querySelectorAll("section.tab").forEach(s=>s.classList.toggle("on", s.id==="tab-"+id));
  if(!rendered[id]){ R[id]($("#tab-"+id)); rendered[id]=true; } store("pl-tab", id); if(then) then(); }
window.plGoPacket = no => show("packets", ()=>selectPacket(no, true));
window.plGoStream = id => show("tcp", ()=>openStream(id));
const pkLink = no => no==null?"":`<a href="#" class="mono" onclick="plGoPacket(${no});return false">#${no}</a>`;

/* ---------- overview ---------- */
const R = {};
R.overview = el => {
  const S = D.stats, H = S.health;
  const hcol = v => v>=85?"var(--good)":v>=60?"var(--med)":v>=35?"var(--high)":"var(--crit)";
  const hlab = v => v>=85?"Healthy":v>=60?"Degraded":v>=35?"Impaired":"Critical";
  const sevCounts = SEV.map(s=>`<div class="card tile"><div class="k">${sev(s)}</div><div class="v">${S.severity[s]||0}</div></div>`).join("");
  el.innerHTML = `
  <div class="grid g4">
    <div class="card tile"><div class="k">Packets</div><div class="v">${S.packets.toLocaleString()}</div><div class="muted small">${S.avg_pps} pkt/s avg</div></div>
    <div class="card tile"><div class="k">Bytes</div><div class="v">${fmtB(S.bytes)}</div><div class="muted small">${fmtBps(S.avg_bps)} avg</div></div>
    <div class="card tile"><div class="k">Duration</div><div class="v">${fmtS(S.duration)}</div><div class="muted small">${S.start?new Date(S.start*1000).toISOString().replace("T"," ").slice(0,19)+" UTC":""}</div></div>
    <div class="card tile"><div class="k">TCP streams · conversations</div><div class="v">${S.tcp_streams} · ${S.conversations}</div><div class="muted small">analysed in ${D.meta.analysis_seconds}s</div></div>
  </div>
  ${D.meta.warnings.length?`<div class="warn">${D.meta.warnings.map(esc).join("<br>")}</div>`:""}
  <h2>Network health</h2>
  <div class="card"><div class="health">
    ${["overall","Transport","Network","Routing","Application","Security"].map(k=>`<div><div class="small muted">${k==="overall"?"Overall":k}</div>
      <div style="font-size:22px;font-weight:650">${H[k]}<span class="small muted"> /100 · ${hlab(H[k])}</span></div>
      <div class="meter" role="img" aria-label="${k} health ${H[k]} of 100"><div style="width:${H[k]}%;background:${hcol(H[k])}"></div></div></div>`).join("")}
  </div>${D.meta.capture_point?`<p class="small muted" style="margin:10px 0 0">Capture point: ${esc(D.meta.capture_point)}</p>`:""}</div>
  <h2>Findings by severity</h2><div class="grid g4">${sevCounts}</div>
  <h2>Top root causes</h2>

    <div class="card"><h3 style="margin-top:0">Protocol hierarchy (packets containing layer)</h3><div id="layers"></div></div>
  </div>`;

function hbars(el, rows){ const max = Math.max(1,...rows.map(r=>r[1]));
  el.innerHTML = rows.map(([k,v])=>`<div class="hbar" data-k="${esc(k)}" data-v="${v}"><span class="mono" title="${esc(k)}" style="overflow:hidden;text-overflow:ellipsis">${esc(k)}</span>
    <div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><span class="num muted small" style="text-align:right">${v.toLocaleString()}</span></div>`).join("");
  el.querySelectorAll(".hbar").forEach(h=>{ h.onmousemove=e=>showTip(e,`<b>${esc(h.dataset.k)}</b><br>${Number(h.dataset.v).toLocaleString()} packets`); h.onmouseleave=hideTip; });
}
function timeline(el, tl){
  const W = Math.max(320, el.clientWidth||900), Hh = 180, pl=44, pb=24, pt=8, n=tl.length;
  const max = Math.max(1,...tl.map(b=>b.pkts)); const bw = (W-pl-8)/n; const gap = bw>6?2:0.5;
  const y = v => pt + (Hh-pt-pb)*(1-v/max);
  const ticks = [0, max/2, max].map(v=>Math.round(v));
  let s = `<svg width="100%" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Packets over time">`;
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W-8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`; });
  tl.forEach((b,i)=>{ const x = pl + i*bw + gap/2, w = Math.max(1,bw-gap);
    if(b.pkts) s+=`<rect x="${x}" y="${y(b.pkts)}" width="${w}" height="${Hh-pb-y(b.pkts)}" rx="${Math.min(4,w/2)}" fill="var(--series-1)"/>`;
    if(b.bad) s+=`<rect x="${x}" y="${y(b.bad)}" width="${w}" height="${Hh-pb-y(b.bad)}" rx="${Math.min(4,w/2)}" fill="var(--crit)" stroke="var(--surface)" stroke-width="1"/>`;
    s+=`<rect class="hit" data-i="${i}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${Hh-pt-pb}" fill="transparent"/>`; });
  s += `<line x1="${pl}" x2="${W-8}" y1="${Hh-pb}" y2="${Hh-pb}" stroke="var(--axis)"/>`;
  [0, Math.floor(n/2), n-1].forEach(i=>{ if(tl[i]) s+=`<text x="${pl+i*bw+bw/2}" y="${Hh-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${tl[i].t}s</text>`; });
  el.innerHTML = s + "</svg>";
  el.querySelectorAll(".hit").forEach(r=>{ r.onmousemove=e=>{ const b=tl[+r.dataset.i]; showTip(e,`<b>t = ${b.t}s</b><br>${b.pkts} packets · ${fmtB(b.bytes)}<br>${b.bad} problem packets`); }; r.onmouseleave=hideTip; });
}

/* ---------- generic sortable table ---------- */
function table(el, cols, rows, opts={}){
  let sortK=opts.sort||null, dir=opts.dir||1, q="";
  el.innerHTML = (opts.search!==false?`<div class="filters"><input type="search" placeholder="Filter rows…"><span class="muted small cnt"></span></div>`:"") + `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?"num":""}" data-k="${c.k}">${esc(c.t)}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  const tb = $("tbody",el);
  function draw(){ let r = rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
    if(sortK){ r=[...r].sort((a,b)=>{ const va=a[sortK], vb=b[sortK]; return (va==null)-(vb==null) || (va>vb?1:va<vb?-1:0)*dir; }); }
    const lim=r.slice(0,opts.limit||2000);
    tb.innerHTML = lim.map((x,i)=>`<tr class="${opts.click?"click":""}" data-i="${rows.indexOf(x)}">${cols.map(c=>`<td class="${c.num?"num":""} ${c.mono?"mono":""}">${c.f?c.f(x[c.k],x):esc(x[c.k])}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="empty">No rows</td></tr>`;
    const c = $(".cnt",el); if(c) c.textContent = `${r.length.toLocaleString()} rows`+(r.length>lim.length?` (showing ${lim.length})`:"");
    if(opts.click) tb.querySelectorAll("tr.click").forEach(tr=>tr.onclick=()=>opts.click(rows[+tr.dataset.i]));
  }
  el.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; dir = sortK===k?-dir:1; sortK=k; draw(); });
  const inp = $("input",el); if(inp) inp.oninput=()=>{ q=inp.value.toLowerCase(); draw(); };
  draw();
}

const FLAG_ORDER = ["retransmission","fast_retransmission","spurious_retransmission","out_of_order","lost_segment","ack_unseen","duplicate_ack","zero_window","zero_window_probe","window_full","window_update","keep_alive"];

  const rows = D.streams.map(s=>({...s, bad: FLAG_ORDER.filter(f=>!["window_update","keep_alive"].includes(f)).reduce((a,f)=>a+(s.flags[f]||0),0),

function openStream(id){

     ${s.response_times_ms.length?`<b class="small muted">Request → response times</b><ul class="tight small">${s.response_times_ms.slice(0,10).map(([a,b,t])=>`<li>${pkLink(a)} → ${pkLink(b)}: ${ms(t)}</li>`).join("")}</ul>`:""}

function ladder(el, s){
  const rows = s.ladder, W = Math.max(560, el.clientWidth||800), rowH = 26, top=34, H = top + rows.length*rowH + 10;
  const xl = 150, xr = W-240;
  let g = `<svg width="${W}" height="${H}" role="img" aria-label="TCP ladder diagram">
   <text x="${xl}" y="18" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">${esc(s.client)}</text>
   <text x="${xr}" y="18" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">${esc(s.server)}</text>
   <line x1="${xl}" x2="${xl}" y1="24" y2="${H}" stroke="var(--axis)" stroke-width="2"/><line x1="${xr}" x2="${xr}" y1="24" y2="${H}" stroke="var(--axis)" stroke-width="2"/>`;
  rows.forEach((r,i)=>{ const y = top + i*rowH + 12; const c2s = r.dir==="c2s"; const bad = r.analysis.filter(a=>!["window_update","keep_alive_ack"].includes(a));
    const col = bad.length?"var(--crit)":c2s?"var(--series-1)":"var(--muted)";
    const x1 = c2s?xl:xr, x2 = c2s?xr:xl, ah = c2s?-7:7;
    g += `<g class="lr" data-i="${i}" style="cursor:pointer"><rect x="0" y="${y-12}" width="${W}" height="${rowH}" fill="transparent"/>
      <line x1="${x1}" x2="${x2}" y1="${y-5}" y2="${y+5}" stroke="${col}" stroke-width="2"/>
      <path d="M${x2} ${y+5} l${ah} -1 l${ah*0.3} -6 z" fill="${col}"/>
      <text x="8" y="${y+4}" font-size="11" fill="var(--muted)" class="mono">${r.t.toFixed(4)}s #${r.no}</text>
      <text x="${(xl+xr)/2}" y="${y-2}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${esc(r.flags)} ${r.len?`len=${r.len}`:""} ${bad.length?"["+esc(bad.join(", "))+"]":""}</text>
      <text x="${W-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">seq=${r.seq} ack=${r.ack} win=${r.win}</text></g>`; });
  el.innerHTML = g + "</svg>";
  el.querySelectorAll(".lr").forEach(n=>{ const r=rows[+n.dataset.i];
    n.onmousemove=e=>showTip(e,`<b>#${r.no}</b> ${r.dir==="c2s"?"client → server":"server → client"}<br>${esc(r.app)} ${esc(r.flags)} len ${r.len}<br>rel seq ${r.seq} · rel ack ${r.ack} · win ${r.win}${r.analysis.length?"<br><b>"+esc(r.analysis.join(", "))+"</b>":""}`);
    n.onmouseleave=hideTip; n.onclick=()=>plGoPacket(r.no); });
}

/* ---------- 3D path engine ---------- */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888";
const ST_COLOR = {ok:"--good", warn:"--med", degraded:"--med", oneway:"--low", fail:"--crit"};
const KIND_Y = {cloud:3.2, router:1.6, l3switch:1.2, switch:0, segment:-.4, ap:0, host:-1.8, server:-1.8};

function layout(graph){
  // deterministic 3D force layout: main flow along x, device kinds in horizontal bands
  const N = graph.nodes, idx = new Map(N.map((n,i)=>[n.id,i])), P = N.map((n,i)=>[Math.cos(i*2.39)*7, KIND_Y[n.kind]||0, Math.sin(i*2.39)*7]);
  const main = (graph.flows.find(f=>f.kind!=="control")||graph.flows[0]||{hops:[]}).hops;
  main.forEach((h,i)=>{ const k=idx.get(h); if(k!=null) P[k]=[(i-(main.length-1)/2)*7, P[k][1], 0]; });
  const E = graph.links.map(l=>[idx.get(l.a), idx.get(l.b)]).filter(e=>e[0]!=null&&e[1]!=null);
  for(let it=0; it<350; it++){
    const F = N.map(()=>[0,0,0]), cool = 1 - it/350;
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const d=[0,1,2].map(a=>P[i][a]-P[j][a]), r2=Math.max(.5, d[0]*d[0]+d[1]*d[1]+d[2]*d[2]), f=40/r2;
      for(let a=0;a<3;a++){ F[i][a]+=d[a]*f/Math.sqrt(r2); F[j][a]-=d[a]*f/Math.sqrt(r2); } }
    E.forEach(([i,j])=>{ const d=[0,1,2].map(a=>P[j][a]-P[i][a]), r=Math.hypot(...d)||1, f=(r-6.5)*.18;
      for(let a=0;a<3;a++){ F[i][a]+=d[a]/r*f; F[j][a]-=d[a]/r*f; } });
    N.forEach((n,i)=>{ F[i][1]+=((KIND_Y[n.kind]||0)-P[i][1])*.6; F[i][2]-=P[i][2]*.04;
      for(let a=0;a<3;a++) P[i][a]+=Math.max(-1.5,Math.min(1.5,F[i][a]))*cool; });
  }
  return new Map(N.map((n,i)=>[n.id,P[i]]));
}

function make3D(el, graph, opts={}){
  if(!window.THREE){ return null; }
  const T = window.THREE, W = () => el.clientWidth, H = () => el.clientHeight;
  const renderer = new T.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(2, devicePixelRatio||1)); renderer.setSize(W(), H());
  el.appendChild(renderer.domElement);
  const scene = new T.Scene(), camera = new T.PerspectiveCamera(45, W()/H(), .1, 2000);
  scene.add(new T.HemisphereLight(0xffffff, 0x444444, 1.0)); const dl = new T.DirectionalLight(0xffffff,.6); dl.position.set(10,20,15); scene.add(dl);
  const pos = layout(graph), meshes = new Map(), labels = new Map(), ink = new T.Color(css("--ink-2")), acc = new T.Color(css("--accent"));
  const col = k => new T.Color(css(k));
  const KC = {router:col("--accent"), l3switch:col("--accent"), switch:col("--good"), host:col("--ink-2"), server:col("--high"),
              ap:col("--med"), cloud:col("--muted"), segment:col("--muted")};
  const geo = {router:new T.CylinderGeometry(1,1,.7,28), l3switch:new T.BoxGeometry(2,.8,1.4), switch:new T.BoxGeometry(2.1,.5,1.3),
               host:new T.BoxGeometry(1,.8,.9), server:new T.BoxGeometry(.9,1.8,1), ap:new T.ConeGeometry(.8,1.2,20),
               cloud:new T.SphereGeometry(1.3,24,16), segment:new T.TorusGeometry(1,.12,10,40)};
  graph.nodes.forEach(n=>{
    const inferred = n.observed===false || n.kind==="cloud";
    const m = new T.Mesh(geo[n.kind]||geo.host, new T.MeshStandardMaterial({color:KC[n.kind]||ink, roughness:.55, metalness:.1,
                         transparent:inferred, opacity:inferred?.35:1, wireframe:n.observed===false && n.kind!=="cloud"}));
    if(n.kind==="segment") m.rotation.x = Math.PI/2;
    m.scale.setScalar(1.5);
    m.position.set(...pos.get(n.id)); m.userData = n; scene.add(m); meshes.set(n.id, m);
    const d = document.createElement("div"); d.className = "lbl"+(inferred?" inf":""); d.textContent = n.label; el.appendChild(d); labels.set(n.id, d);
  });
  const lineMat = new T.LineBasicMaterial({color:ink, transparent:true, opacity:.55});
  const tunMat = new T.LineDashedMaterial({color:0xa05ae0, dashSize:.6, gapSize:.35});
  const infMat = new T.LineDashedMaterial({color:ink, dashSize:.3, gapSize:.3, transparent:true, opacity:.5});
  const capMat = new T.MeshBasicMaterial({color:acc});
  graph.links.forEach(l=>{
    const a = pos.get(l.a), b = pos.get(l.b); if(!a||!b) return;
    const g = new T.BufferGeometry().setFromPoints([new T.Vector3(...a), new T.Vector3(...b)]);
    const line = new T.Line(g, l.kind==="tunnel"?tunMat:(l.observed?lineMat:infMat)); line.computeLineDistances(); scene.add(line);
    if(l.captures && l.captures.length){      // capture point = lens ring on the link
      const r = new T.Mesh(new T.TorusGeometry(.45,.09,8,28), capMat); r.position.set((a[0]+b[0])/2,(a[1]+b[1])/2+.2,(a[2]+b[2])/2);
      r.lookAt(new T.Vector3(...b)); r.userData = {capture:l.captures}; scene.add(r);
      const d = document.createElement("div"); d.className="lbl"; d.style.color="var(--accent)"; d.textContent="◉ capture"+(l.captures.length>1?" ×"+l.captures.length:""); el.appendChild(d);
      labels.set("cap:"+l.a+"|"+l.b, d); meshes.set("cap:"+l.a+"|"+l.b, r);
    }
  });
  // fit camera
  const box = new T.Box3(); meshes.forEach(m=>box.expandByObject(m)); const c = box.getCenter(new T.Vector3()), size = box.getSize(new T.Vector3());
  // fit both extents: horizontal field of view depends on the stage's aspect ratio
  const vh = Math.tan(camera.fov*Math.PI/360), hh = vh*camera.aspect, halfW = Math.max(size.x, size.z)/2 + 2, halfH = size.y/2 + 3;
  let rad = Math.max(halfW/hh, halfH/vh, 12)*1.15 + Math.min(size.x, size.z)/2, th = .35, ph = 1.15; const target = c.clone();
  const place = () => { camera.position.set(target.x+rad*Math.sin(ph)*Math.sin(th), target.y+rad*Math.cos(ph), target.z+rad*Math.sin(ph)*Math.cos(th)); camera.lookAt(target); };
  place();
  // orbit controls (drag = rotate, wheel/pinch = zoom, right-drag or shift = pan)
  let drag=null, pinch=null;
  const cv = renderer.domElement;
  cv.addEventListener("pointerdown", e=>{ drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey,moved:0}; cv.setPointerCapture(e.pointerId); cv.style.cursor="grabbing"; });
  cv.addEventListener("pointermove", e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; drag.moved+=Math.abs(dx)+Math.abs(dy);
    if(drag.pan){ const s=rad/600, r=new T.Vector3().subVectors(camera.position,target).cross(camera.up).normalize(); target.addScaledVector(r, dx*s).addScaledVector(camera.up, dy*s); }
    else { th-=dx*.006; ph=Math.max(.15,Math.min(Math.PI-.15, ph-dy*.006)); } place(); });
  cv.addEventListener("pointerup", e=>{ cv.style.cursor="grab"; if(drag && drag.moved<5) pick(e); drag=null; });
  cv.addEventListener("contextmenu", e=>e.preventDefault());
  cv.addEventListener("wheel", e=>{ e.preventDefault(); rad=Math.max(5,Math.min(400, rad*(1+Math.sign(e.deltaY)*.1))); place(); }, {passive:false});
  cv.addEventListener("touchmove", e=>{ if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinch) { rad=Math.max(5,Math.min(400, rad*pinch/d)); place(); } pinch=d; } }, {passive:true});
  cv.addEventListener("touchend", ()=>pinch=null);
  const ray = new T.Raycaster(), mv = new T.Vector2();
  function pick(e){ const r = cv.getBoundingClientRect(); mv.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mv, camera); const hit = ray.intersectObjects([...meshes.values()])[0]; if(hit && opts.onPick) opts.onPick(hit.object.userData); }
  // packets
  const live = []; const pgeo = new T.SphereGeometry(.32, 16, 12);
  function launch({path, status="ok", dieAt=null, dur=1.6, label=""}){
    path = path.filter(id=>pos.has(id));             // only nodes that exist in this graph
    const pts = path.map(id=>{ const p=pos.get(id); return new T.Vector3(p[0],p[1]+.9,p[2]); }); if(pts.length<2) return;
    const stopIdx = dieAt!=null ? path.indexOf(dieAt) : -1;
    const m = new T.Mesh(pgeo, new T.MeshBasicMaterial({color:col(ST_COLOR[status]||"--good")})); scene.add(m);
    live.push({m, pts, t0:performance.now(), dur:dur*1000*(Math.max(1,pts.length-1)/2), stop: stopIdx>0?stopIdx:pts.length-1, label, burst:stopIdx>0});
  }
  function burst(p){ const m = new T.Mesh(new T.SphereGeometry(.4,16,12), new T.MeshBasicMaterial({color:col("--crit"),transparent:true,opacity:.9}));
    m.position.copy(p); scene.add(m); live.push({m, burstAnim:true, t0:performance.now()}); }
  let hl = null;
  function highlight(ids){ meshes.forEach((m,id)=>{ if(m.material.emissive){ m.material.emissive.setHex(0x000000); } });
    (ids||[]).forEach(id=>{ const m=meshes.get(id); if(m&&m.material.emissive) m.material.emissive.copy(acc).multiplyScalar(.45); }); hl=ids; }
  const v = new T.Vector3(); let raf, alive = true;
  function frame(now){
    if(!alive) return;
    raf = requestAnimationFrame(frame);              // schedule first: one bad packet must not stop the scene
    for(let i=live.length-1;i>=0;i--){ const p = live[i];
      if(p.burstAnim){ const k=(now-p.t0)/700; p.m.scale.setScalar(1+k*4); p.m.material.opacity=Math.max(0,.9-k); if(k>=1){ scene.remove(p.m); live.splice(i,1);} continue; }
      // rAF's timestamp can precede the performance.now() taken at launch: clamp so progress is never negative
      const k = Math.max(0, Math.min(1,(now-p.t0)/p.dur)), seg = k*(p.pts.length-1);
      if(seg >= p.stop){ p.m.position.copy(p.pts[p.stop]); if(p.burst) burst(p.pts[p.stop]); scene.remove(p.m); live.splice(i,1); continue; }
      const s = Math.floor(seg); p.m.position.lerpVectors(p.pts[s], p.pts[Math.min(s+1,p.pts.length-1)], seg-s); }
    renderer.render(scene, camera);
    const w=W(), h=H();
    const placed = [];
    labels.forEach((d,id)=>{ const m = meshes.get(id); if(!m) return; v.copy(m.position); v.y+=1.1; v.project(camera);
      if(v.z>1){ d.style.display="none"; return; } d.style.display="";
      let x = (v.x+1)/2*w, y = (1-v.y)/2*h; const lw = d.offsetWidth, lh = d.offsetHeight + 2;
      for(const q of placed) if(Math.abs(q[0]-x) < (q[2]+lw)/2 && Math.abs(q[1]-y) < lh) y = q[1] - lh;   // stack colliding labels
      placed.push([x, y, lw]); d.style.left = x+"px"; d.style.top = y+"px"; });
  }
  raf = requestAnimationFrame(frame);
  const ro = new ResizeObserver(()=>{ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.updateProjectionMatrix(); }); ro.observe(el);
  return {launch, highlight, clear(){ live.forEach(p=>scene.remove(p.m)); live.length=0; },
          dispose(){ alive=false; cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose(); cv.remove(); labels.forEach(d=>d.remove()); }};
}

// replay a flow's captured packets: capture-time order, compressed to ~12 s; failed packets die at the break point
function flowSequence(f){
  const st = f.steps||[], span = Math.max(1e-6, st.length ? st[st.length-1].t : 1), out = [];
  st.forEach(s=>{ let path = s.dir==="fwd" ? f.hops : [...f.hops].reverse(), dieAt = null;
    if(f.break_at && s.status==="fail" && s.dir==="fwd") dieAt = f.break_at;
    if(f.break_at && s.status==="fail" && s.dir==="rev"){ const i = path.indexOf(f.break_at); if(i>0) path = path.slice(i); }
    if(f.status==="fail" && f.break_at && s.dir==="fwd" && !st.some(x=>x.dir==="rev")) dieAt = f.break_at;
    out.push({at: Math.min(12, s.t/span*12), path, status:s.status, dieAt, label:s.label, no:s.no}); });
  return out;
}

function run(engine, seq, caption, onStep){
  const timers = []; engine.clear();
  seq.forEach((s,i)=>timers.push(setTimeout(()=>{ engine.launch(s); if(caption) caption.innerHTML = s.caption || `<b>${s.no?"#"+s.no+" ":""}</b>${esc(s.label)}`; if(onStep) onStep(i); }, s.at*1000)));
  return () => timers.forEach(clearTimeout);
}

// 2D fallback when three.min.js is not available
function flat(el, graph, f){
  const lab = new Map(graph.nodes.map(n=>[n.id,n]));
  el.innerHTML = `<div style="padding:16px"><p class="muted small">3D view unavailable (three.min.js not found next to this report) — showing the hop chain.</p>
    <div class="hopchain">${(f?f.hops:[]).map((h,i)=>`${i?"→":""}<span class="h ${lab.get(h)&&lab.get(h).observed===false?"inf":""} ${f.break_at===h?"brk":""}">${esc(lab.get(h)?lab.get(h).label:h)}</span>`).join(" ")}</div></div>`;
}

function hopChain(graph, f){
  const lab = new Map(graph.nodes.map(n=>[n.id,n])), cb = new Set((f.capture_points||[f.capture_between]).flat());
  return `<div class="hopchain">${f.hops.map((h,i)=>{ const n = lab.get(h)||{label:h};
    return `${i?"<span class='muted'>→</span>":""}<span class="h ${n.observed===false?"inf":""} ${f.break_at===h?"brk":""} ${cb.has(h)?"capt":""}" data-node="${esc(h)}" title="${esc((n.evidence||[]).join("; "))}">${esc(n.label)}</span>`; }).join(" ")}</div>`;
}

function nodeCard(n){
  if(!n || n.capture) return `<div class="muted small">Capture point: ${esc((n&&n.capture||[]).join(", "))}</div>`;
  return `<div class="kv"><b>Device</b><span>${esc(n.label)} <span class="chip">${esc(n.kind)}</span>${n.observed===false?'<span class="chip">inferred</span>':""}</span>
    ${n.ips&&n.ips.length?`<b>IP</b><span class="mono">${esc(n.ips.slice(0,5).join(", "))}</span>`:""}
    ${n.macs&&n.macs.length?`<b>MAC</b><span class="mono">${esc(n.macs.slice(0,3).join(", "))}</span>`:""}
    ${n.roles&&n.roles.length?`<b>Roles</b><span>${esc(n.roles.join(", "))}</span>`:""}
    ${n.captures?`<b>Seen in</b><span>${esc(n.captures.join(", "))}</span>`:""}
    <b>Evidence</b><span>${esc((n.evidence||[]).join("; ")||"—")}</span></div>`;
}

R.path = el => {
  const views = [["capture", D.path]].concat(D.path_folder ? [["folder", D.path_folder]] : []).filter(v=>v[1]);
  if(!views.length){ el.innerHTML='<div class="card empty">No path information (no IP or discovery traffic).</div>'; return; }
  el.innerHTML = `${views.length>1?`<div class="filters"><span class="muted small">View:</span><button data-v="0">This capture</button><button data-v="1">Whole folder (${esc(D.path_folder.capture.split(" + ").length)} captures stitched)</button></div>`:""}
    <div class="p3"><div><div class="stage" id="stage"><div class="hud"><button id="p-play">▶ Replay flow</button><button id="p-all">Replay all</button><button id="p-reset">Reset view</button></div><div class="cap" id="p-cap">Select a flow, then replay it. Drag to rotate, wheel/pinch to zoom, right-drag to pan, click a device for its evidence.</div></div>
      <div class="legend3" style="margin-top:8px"><span><i style="background:var(--good)"></i>ok</span><span><i style="background:var(--med)"></i>retransmission / warning</span><span><i style="background:var(--low)"></i>one-way here</span><span><i style="background:var(--crit)"></i>failed / dropped</span>
        <span>◉ capture point</span><span>solid = observed · wireframe/dashed = inferred</span><span style="color:#a05ae0">- - tunnel</span></div>
      <div class="card" style="margin-top:10px" id="p-notes"></div></div>
    <div class="side"><div class="card"><h3 style="margin-top:0">Flows</h3><div class="flowlist" id="p-flows"></div></div>
      <div class="card" id="p-flow"></div><div class="card" id="p-node"><span class="muted small">Click a device in the 3D view or in the hop chain.</span></div></div></div>`;
  let eng = null, stop = null, graph = null, cur = null;
  const stage = $("#stage", el), cap = $("#p-cap", el);
  function load(i){
    graph = views[i][1]; if(stop) stop(); if(eng) eng.dispose();
    stage.querySelectorAll("canvas,.lbl").forEach(x=>x.remove());
    eng = make3D(stage, graph, {onPick: n => { $("#p-node",el).innerHTML = nodeCard(n); if(n && n.id) eng.highlight([n.id]); }});
    $("#p-notes",el).innerHTML = `<h3 style="margin-top:0">How this path was inferred</h3><ul class="tight">${graph.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`;
    $("#p-flows",el).innerHTML = graph.flows.map((f,k)=>`<div class="flowrow" data-f="${k}"><span class="dot st-${esc(f.status)}"></span><div><div>${esc(f.label)}</div>
      <div class="muted small">${esc(f.status)} · ${f.packets} pkt${f.captures&&f.captures.length>1?` · seen at ${f.captures.length} capture points`:""}</div></div></div>`).join("") || '<div class="muted small">No flows.</div>';
    $("#p-flows",el).querySelectorAll(".flowrow").forEach(r=>r.onclick=()=>select(+r.dataset.f, true));
    el.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on", +b.dataset.v===i));
    select(0, false);
  }
  function select(k, play){
    cur = graph.flows[k]; if(!cur) return;
    $("#p-flows",el).querySelectorAll(".flowrow").forEach(r=>r.classList.toggle("on", +r.dataset.f===k));
    $("#p-flow",el).innerHTML = `<h3 style="margin-top:0"><span class="dot st-${esc(cur.status)}" style="display:inline-block;margin-right:6px"></span>${esc(cur.label)}</h3>
      ${hopChain(graph, cur)}<p style="margin:8px 0 0">${esc(cur.why)}</p>
      ${cur.break_at?`<p class="small" style="color:var(--crit);margin:6px 0 0">Breaks at: ${esc((graph.nodes.find(n=>n.id===cur.break_at)||{label:cur.break_at}).label)}</p>`:""}
      ${cur.branches&&cur.branches.length?`<p class="small muted">Parallel (ECMP) branch: ${cur.branches.map(b=>esc(b.map(x=>(graph.nodes.find(n=>n.id===x)||{label:x}).label).join(" → "))).join("; ")}</p>`:""}`;
    $("#p-flow",el).querySelectorAll("[data-node]").forEach(h=>h.onclick=()=>{ const n = graph.nodes.find(x=>x.id===h.dataset.node); $("#p-node",el).innerHTML = nodeCard(n); if(eng) eng.highlight([h.dataset.node]); });
    if(!eng){ flat(stage, graph, cur); return; }
    eng.highlight(cur.hops);
    if(play){ if(stop) stop(); stop = run(eng, flowSequence(cur), cap); }
  }
  el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>load(+b.dataset.v));
  $("#p-play",el).onclick = ()=>{ if(cur && eng){ if(stop) stop(); stop = run(eng, flowSequence(cur), cap); } };
  $("#p-all",el).onclick = ()=>{ if(!eng) return; if(stop) stop(); const seq = graph.flows.flatMap((f,k)=>flowSequence(f).slice(0,6).map(s=>({...s, at:k*1.2+s.at/6})));
    stop = run(eng, seq, cap); };
  $("#p-reset",el).onclick = ()=>load(views.findIndex(v=>v[1]===graph));
  load(0);
};

/* ---------- scenarios ---------- */
R.scen = el => {
  const S = D.scenarios||[];
  if(!S.length){ el.innerHTML='<div class="card empty">No scenario topics match this capture.</div>'; return; }
  const found = new Map(D.findings.map(f=>[f.id,f]));
  el.innerHTML = `<p class="muted">For each protocol in this capture: how its packets <b>normally</b> travel, what goes <b>wrong</b>, why, how to fix it now and how to prevent it.
    Cards outlined in orange were <b>detected in this capture</b>. Animations use generic devices by role; the <b>Path 3D</b> tab shows this capture's real devices.</p>
    <div class="scen-grid"><div class="card" id="s-topics">${S.map((t,i)=>`<div class="topic" data-t="${i}">${esc(t.title)}${t.failures.some(f=>f.findings.some(x=>found.has(x)))?' <span class="sev high"></span>':""}</div>`).join("")}</div>
    <div><div class="stage" id="s-stage" style="height:min(46vh,420px)"><div class="hud"><button id="s-normal">▶ Normal flow</button></div><div class="cap" id="s-cap">Pick a scenario to animate.</div></div>
      <div class="card" style="margin-top:10px" id="s-body"></div></div></div>`;
  let eng = null, stop = null;
  function roleGraph(t){
    // generic devices by role: the capture's real devices are in the Path 3D tab (guessing a role→device mapping mislabels them)
    const names = t.roles.slice();
    const kinds = t.roles.map(r=>/switch|bridge|authenticator/i.test(r)?"switch":/router|gateway|leaf|spine|rp|dr|vtep|relay|tunnel|isp|underlay|firewall|proxy|querier/i.test(r)?"router":/server|resolver|radius|dhcp/i.test(r)?"server":"host");
    return {nodes:names.map((n,i)=>({id:"r"+i, label:n, kind:kinds[i], observed:true})), links:names.slice(1).map((_,i)=>({a:"r"+i, b:"r"+(i+1), kind:"l2", observed:true})),
            flows:[{kind:"data", hops:names.map((_,i)=>"r"+i)}], notes:[]};
  }
  const between = (a,b) => { const out=[]; const s=a<=b?1:-1; for(let i=a;i!==b+s;i+=s) out.push("r"+i); return out; };
  function seqFor(t, f){
    const steps = f ? t.normal.slice(0, f.at+1) : t.normal, seq = [];
    steps.forEach((s,i)=>{ const last = f && i===f.at;
      const path = s.from===s.to ? ["r"+s.from, "r"+Math.min(s.from+1,t.roles.length-1), "r"+s.from] : between(s.from, s.to);
      seq.push({at:i*1.7, path, status: last && f.drop!=null ? "fail" : "ok", dieAt: last && f.drop!=null ? "r"+f.drop : null, label:s.label,
                caption:`<b>${i+1}. ${esc(s.label)}</b> — ${esc(s.note)}`}); });
    if(f && f.reply) seq.push({at:steps.length*1.7, path:between(f.reply[0], f.reply[1]), status:"fail", label:f.reply[2],
                               caption:`<b style="color:var(--crit)">✕ ${esc(f.reply[2])}</b> — ${esc(f.symptom)}`});
    if(f && f.drop!=null) seq.push({at:steps.length*1.7+.2, path:["r"+f.drop], status:"fail", label:"", caption:`<b style="color:var(--crit)">✕ ${esc(f.title)}</b> — ${esc(f.symptom)}`});
    return seq;
  }
  function open(i){
    const t = S[i];
    el.querySelectorAll(".topic").forEach(x=>x.classList.toggle("on", +x.dataset.t===i));
    if(stop) stop(); if(eng) eng.dispose();
    const stg = $("#s-stage",el); stg.querySelectorAll("canvas,.lbl").forEach(x=>x.remove());
    const g = roleGraph(t); eng = make3D(stg, g);
    if(!eng) flat(stg, g, g.flows[0]);
    const play = f => { if(!eng) return; if(stop) stop(); stop = run(eng, seqFor(t, f), $("#s-cap",el)); };
    $("#s-normal",el).onclick = () => play(null);
    $("#s-body",el).innerHTML = `<h2 style="margin-top:0">${esc(t.title)}</h2><p>${esc(t.summary)}</p>
      <h3>Normal packet travel</h3><ol class="steps">${t.normal.map(s=>`<li><b>${esc(t.roles[s.from])} → ${esc(t.roles[s.to])}: ${esc(s.label)}</b><br><span class="muted">${esc(s.note)}</span></li>`).join("")}</ol>
      <h3>When it goes wrong</h3>${t.failures.map((f,k)=>{ const hit = f.findings.filter(x=>found.has(x));
        return `<div class="fcard ${hit.length?"seen":""}"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h4>${esc(f.title)}</h4>
          ${hit.length?hit.map(x=>`<a href="#" class="chip" onclick="plGoFinding('${esc(found.get(x).uid)}');return false">detected: ${esc(found.get(x).title)}</a>`).join(""):""}
          <span class="spacer"></span><button data-f="${k}">▶ Animate</button></div>
          <div class="small"><b>On the wire:</b> ${esc(f.symptom)}</div>
          <div class="fcols"><div><b>Why it happens</b>${f.why.map(esc).join("<br>")}</div><div><b>Fix now</b>${f.fix.map(esc).join("<br>")}</div><div><b>Prevent / mitigate</b>${f.prevent.map(esc).join("<br>")}</div></div></div>`; }).join("")}`;
    $("#s-body",el).querySelectorAll("button[data-f]").forEach(b=>b.onclick=()=>{ play(t.failures[+b.dataset.f]); $("#s-stage",el).scrollIntoView({block:"nearest"}); });
    play(null);
  }
  el.querySelectorAll(".topic").forEach(x=>x.onclick=()=>open(+x.dataset.t));
  open(0);
};

const start = store("pl-tab"); show(TABS.some(t=>t[0]===start)?start:"overview");
})();
</script>
